name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bail out early so a red push doesn't burn minutes on later jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # Menangkap halaman terproteksi yang loop render karena args query-nya
      # tidak stabil. Semua dependensi di-stub, jadi tidak butuh jaringan.
      - name: Render check (authenticated pages)
        run: bun run check:render:authed

      # The chunk-size warning this surfaces is advisory, not a failure, so the
      # build is only allowed to fail on a real compile or bundle error.
      - name: Build
        run: bun run build
